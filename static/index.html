<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Characterization</title>
  <link rel="icon" href="icon.ico">
  <link rel="stylesheet" href="styles.css">
  <script>
    // Set the theme before first render (prevents a flash)
    try {
      const th = localStorage.getItem("theme");
      if (th) document.documentElement.dataset.theme = th;
    } catch {}
  </script>
</head>
<body>
  <header>
    <h1><span>⬡</span> Characterization <small id="app-version" hidden></small></h1>
    <input id="search" type="search" placeholder="">
    <select id="filter">
      <option value="all"></option>
      <option value="complete"></option>
      <option value="incomplete"></option>
    </select>
    <select id="lang" title="Language / Sprache">
      <option value="en">EN</option>
      <option value="de">DE</option>
    </select>
    <button id="btn-theme"></button>
    <button id="btn-undo">↩</button>
    <button id="btn-backup"></button>
    <button class="primary" id="btn-new-project"></button>
    <button id="btn-quit"></button>
  </header>

  <!-- Lesemodus: der Datensatz wird gerade auf einem anderen PC bearbeitet -->
  <div id="ro-banner" hidden>
    <span id="ro-text"></span>
    <button id="ro-takeover"></button>
  </div>

  <main>
    <section id="dashboard"></section>
    <section id="projects"></section>
  </main>

  <dialog id="dlg-project">
    <div class="dlg-body">
    <h3></h3>
    <div class="dlg-row"><input id="project-name"></div>
    <div class="error" id="project-error"></div>
    <div class="dlg-actions">
      <button data-close></button>
      <button class="primary" id="project-save"></button>
    </div>
      </div>
  </dialog>

  <dialog id="dlg-molecule">
    <div class="dlg-body">
    <h3></h3>
    <div class="dlg-row"><div id="mol-name" class="rich-field" contenteditable="true" role="textbox" spellcheck="false"></div></div>
    <div class="dlg-row"><input id="mol-smiles" data-no-symbols></div>
    <p class="hint" id="mol-hint"></p>
    <div class="error" id="mol-error"></div>
    <div class="dlg-actions">
      <button data-close></button>
      <button class="primary" id="mol-save"></button>
    </div>
      </div>
  </dialog>

  <dialog id="dlg-detail">
    <div class="dlg-body">
    <h3 class="detail-title-bar"><div id="detail-title" class="rich-field" contenteditable="true" role="textbox" spellcheck="false"></div></h3>
    <div class="detail-img-row">
      <div class="img-block" id="img-block-image" data-slot="image">
        <div class="img-block-head">
          <span id="img-title-image"></span>
          <span class="paste-badge" id="paste-badge-image">Ctrl+V</span>
        </div>
        <div class="img-frame">
          <img id="img-view-image" alt="">
          <div class="img-empty" id="img-empty-image">
            <span class="glyph">⬡</span>
            <span id="img-empty-text-image"></span>
          </div>
        </div>
        <div class="img-actions">
          <button id="img-pick-image"></button>
          <button id="img-paste-image"></button>
          <button id="img-clear-image"></button>
          <span class="cdx-group">
            <button id="img-cdx-image" class="cdx-btn" hidden></button>
            <button id="img-copy-image" class="cdx-btn" hidden></button>
          </span>
        </div>
        <div class="error" id="img-warn-image"></div>
      </div>
      <div class="img-block" id="img-block-scheme" data-slot="scheme">
        <div class="img-block-head">
          <span id="img-title-scheme"></span>
          <span class="paste-badge" id="paste-badge-scheme">Ctrl+V</span>
        </div>
        <div class="img-frame">
          <img id="img-view-scheme" alt="">
          <div class="img-empty" id="img-empty-scheme">
            <span class="glyph">⬡ → ⬡</span>
            <span id="img-empty-text-scheme"></span>
          </div>
        </div>
        <div class="img-actions">
          <button id="img-pick-scheme"></button>
          <button id="img-paste-scheme"></button>
          <button id="img-clear-scheme"></button>
          <span class="cdx-group">
            <button id="img-cdx-scheme" class="cdx-btn" hidden></button>
            <button id="img-copy-scheme" class="cdx-btn" hidden></button>
          </span>
        </div>
        <div class="error" id="img-warn-scheme"></div>
      </div>
      <div class="img-block" id="img-block-equation" data-slot="equation">
        <div class="img-block-head">
          <span id="img-title-equation"></span>
          <span class="paste-badge" id="paste-badge-equation">Ctrl+V</span>
        </div>
        <div class="img-frame">
          <img id="img-view-equation" alt="">
          <div class="img-empty" id="img-empty-equation">
            <span class="glyph">⬡ + ⬡ → ⬡</span>
            <span id="img-empty-text-equation"></span>
          </div>
        </div>
        <div class="img-actions">
          <button id="img-pick-equation"></button>
          <button id="img-paste-equation"></button>
          <button id="img-clear-equation"></button>
          <span class="cdx-group">
            <button id="img-cdx-equation" class="cdx-btn" hidden></button>
            <button id="img-copy-equation" class="cdx-btn" hidden></button>
          </span>
        </div>
        <div class="error" id="img-warn-equation"></div>
      </div>
    </div>
    <h4 class="sec-label" id="sec-props"></h4>
    <div class="dlg-row">
      <input id="detail-smiles" data-no-symbols>
      <button id="detail-smiles-save"></button>
    </div>
    <div class="hint" id="detail-meta"></div>
    <div class="phys-row">
      <select id="phys-state">
        <option value=""></option>
        <option value="solid"></option>
        <option value="oil"></option>
      </select>
      <input id="phys-color" spellcheck="false">
      <input id="phys-consistency" spellcheck="false">
    </div>
    <div class="lit-row">
      <label><input type="checkbox" id="lit-known"> <span id="lit-label"></span></label>
      <input id="lit-doi" spellcheck="false" data-no-symbols>
    </div>
    <div class="lit-row" id="lit-cite-row">
      <div id="lit-citation" class="rich-field" contenteditable="true" role="textbox" spellcheck="false" data-multiline></div>
    </div>
    <div class="lit-row" id="lit-si-row"></div>
    <div class="sample-row">
      <label><input type="checkbox" id="sample-available"> <span id="sample-label"></span></label>
      <input id="sample-number" spellcheck="false">
    </div>
    <div class="sample-row" id="sample-comment-row">
      <div id="sample-comment" class="rich-field" contenteditable="true" role="textbox" spellcheck="false" data-multiline></div>
    </div>
    <div class="error" id="detail-error"></div>
    <h4 class="sec-label" id="sec-entries"></h4>
    <div id="detail-entries"></div>
    <!-- Weiterer NMR-Kern: aus der Liste wählen statt „19F NMR" tippen -->
    <div class="dlg-row nucleus-row" style="margin-top:12px">
      <select id="nucleus-pick"></select>
      <label class="nucleus-dec"><input type="checkbox" id="nucleus-decoupled"><span></span></label>
      <button id="nucleus-add">+</button>
    </div>
    <div class="dlg-row" style="margin-top:6px">
      <input id="other-label">
      <button id="other-add">+</button>
    </div>
    <div id="export-result"></div>
    <div class="dlg-actions">
      <button class="danger" id="detail-delete"></button>
      <button id="detail-word"></button>
      <button id="detail-export"></button>
      <button class="primary" data-close></button>
    </div>
      </div>
  </dialog>

  <dialog id="dlg-zoom">
    <div class="zoom-bar">
      <strong id="zoom-title"></strong>
      <button class="btn-sm" id="zoom-open"></button>
      <button class="icon-btn" data-close title="">✕</button>
    </div>
    <img id="zoom-img" alt="">
  </dialog>

  <dialog id="dlg-backup">
    <div class="dlg-body">
    <h3></h3>
    <p class="hint" id="backup-hint"></p>
    <div class="dlg-row"><button class="primary" id="backup-now"></button></div>
    <div id="backup-msg"></div>
    <div id="backup-list"></div>
    <h3 id="transfer-title" style="margin-top:18px"></h3>
    <p class="hint" id="transfer-hint"></p>
    <div class="dlg-row">
      <button id="transfer-export"></button>
      <button id="transfer-import"></button>
    </div>
    <div id="transfer-msg"></div>
    <h3 id="datadir-title" style="margin-top:18px"></h3>
    <p class="hint" id="datadir-hint"></p>
    <div class="datadir-current"><span id="datadir-label"></span> <code id="datadir-path"></code></div>
    <div class="dlg-row">
      <button id="datadir-change"></button>
    </div>
    <div id="datadir-msg"></div>
    <div class="dlg-actions">
      <button data-close></button>
    </div>
      </div>
  </dialog>

  <!-- Beenden: sichern, Sperre freigeben, Server herunterfahren -->
  <dialog id="dlg-quit">
    <div class="dlg-body">
    <h3></h3>
    <p id="quit-text"></p>
    <p class="hint" id="quit-hint"></p>
    <div class="error" id="quit-error"></div>
    <div class="dlg-actions" id="quit-actions">
      <button data-close></button>
      <button class="primary" id="quit-confirm"></button>
    </div>
      </div>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
