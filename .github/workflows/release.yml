# Builds the program for Windows and macOS on GitHub's own machines,
# smoke-tests every build and attaches both to one release.
# Triggered by pushing a version tag:
#
#   git tag v1.3.0
#   git push origin v1.3.0
#
# "Run workflow" (Actions tab) or pushing a branch ci/<anything> builds and
# tests without releasing.
# The builds only ever see the repository contents — no dataset, config.json
# or anything else from a developer PC can end up in a download.
name: Release

on:
  push:
    tags: ["v*"]
    branches: ["ci/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            test: --test        # unit tests use Windows paths and APIs
          - os: macos-14        # Apple silicon
            test: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build
        run: python tools/build.py --version "${{ github.ref_name }}" ${{ matrix.test }}

      - name: Clipboard and ChemDraw tests (macOS)
        if: runner.os == 'macOS'
        run: .venv-build/bin/python -m pytest tests/test_clipboard_mac.py -v

      - name: Smoke test (server)
        run: python tools/smoke_test.py

      - name: Mark files like a browser download (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: >
          Get-ChildItem dist\Characterization -Recurse -File |
          ForEach-Object { Set-Content -Path $_.FullName -Stream Zone.Identifier -Value "[ZoneTransfer]`r`nZoneId=3" }

      - name: Smoke test (program window)
        run: python tools/smoke_test.py --window

      # A copy posing as version 0.0.1 updates itself to the newest release
      # on GitHub: real download, checksum, swap and restart
      - name: Self-update test
        run: python tools/update_test.py

      - uses: actions/upload-artifact@v4
        with:
          name: program-${{ runner.os }}
          path: dist/Characterization-*.zip
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # The in-app updater checks every download against this list
      - name: Checksums
        run: cd dist && sha256sum Characterization-* > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${{ github.ref_name }}" dist/*
          --repo "${{ github.repository }}"
          --title "Characterization ${{ github.ref_name }}"
          --generate-notes

      # Linux is no longer supported (v1.2.0 shipped a Linux build once)
      - name: Remove Linux downloads from earlier releases
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          for tag in $(gh release list --repo "$REPO" --limit 100 --json tagName --jq '.[].tagName'); do
            for asset in $(gh release view "$tag" --repo "$REPO" --json assets --jq '.assets[].name' | grep -i linux || true); do
              echo "deleting $asset from $tag"
              gh release delete-asset "$tag" "$asset" --repo "$REPO" --yes
            done
          done
