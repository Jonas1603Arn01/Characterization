# Builds the program for Windows, macOS and Linux on GitHub's own machines,
# smoke-tests every build and attaches all of them to one release.
# Triggered by pushing a version tag:
#
#   git tag v1.2.0
#   git push origin v1.2.0
#
# "Run workflow" (Actions tab) builds and tests without releasing.
# The builds only ever see the repository contents — no dataset, config.json
# or anything else from a developer PC can end up in a download.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            test: --test        # unit tests use Windows paths and APIs
          - os: macos-14        # Apple silicon
            test: ""
          - os: ubuntu-22.04    # older glibc: runs on more distributions
            test: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: System libraries for the Qt window (Linux)
        if: runner.os == 'Linux'
        run: >
          sudo apt-get update && sudo apt-get install -y xvfb
          libxcb-cursor0 libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0
          libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0
          libxcb-xinerama0 libxcb-xkb1 libegl1 libnss3 libasound2

      - name: Build
        run: python tools/build.py --version "${{ github.ref_name }}" ${{ matrix.test }}

      - name: Smoke test (server)
        run: python tools/smoke_test.py

      - name: Mark files like a browser download (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: >
          Get-ChildItem dist\Characterization -Recurse -File |
          ForEach-Object { Set-Content -Path $_.FullName -Stream Zone.Identifier -Value "[ZoneTransfer]`r`nZoneId=3" }

      - name: Smoke test (program window)
        if: runner.os != 'Linux'
        run: python tools/smoke_test.py --window

      - name: Smoke test (program window, Linux)
        if: runner.os == 'Linux'
        env:
          QTWEBENGINE_DISABLE_SANDBOX: "1"
        run: xvfb-run -a python tools/smoke_test.py --window

      - uses: actions/upload-artifact@v4
        with:
          name: program-${{ runner.os }}
          path: |
            dist/Characterization-*.zip
            dist/Characterization-*.tar.gz
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${{ github.ref_name }}" dist/*
          --repo "${{ github.repository }}"
          --title "Characterization ${{ github.ref_name }}"
          --generate-notes
